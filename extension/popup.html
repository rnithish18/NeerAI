<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeerAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="water-bg"></div>
  
  <header>
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#22d3ee" />
          <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
      </defs>
      <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" fill="url(#logoGrad)"/>
    </svg>
    <h1>NeerAI</h1>
  </header>

  <main>
    <div class="session-header">
      <h2>Current Session</h2>
      <div id="provider-badge" class="badge">Unknown</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Interactions</span>
        <span class="stat-value" id="val-interactions">0</span>
      </div>
      <div class="stat-card score-card">
        <span class="stat-label">Sustainability Score</span>
        <span class="stat-value" id="val-score">100</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Estimated Energy</span>
        <span class="stat-value"><span id="val-energy">0.00</span> <span class="unit">kWh</span></span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Estimated Water</span>
        <span class="stat-value"><span id="val-water">0.0</span> <span class="unit">mL</span></span>
      </div>
    </div>

    <div id="nudge-area" class="nudge-area empty">
      <!-- Nudges injected here -->
    </div>

    <div class="actions">
      <button id="btn-reset" class="btn secondary">Reset Session</button>
      <button id="btn-dashboard" class="btn primary">View Dashboard</button>
    </div>
  </main>

  <footer>
    Estimates based on Li et al., 2023 methodology
  </footer>

  <script src="popup.js"></script>
</body>
</html>
